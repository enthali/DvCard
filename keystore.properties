# Keystore-Konfiguration für Release Builds
# WICHTIG: Diese Datei niemals in Git committen!
# Fügen Sie sie zur .gitignore hinzu

# Pfad zum Keystore (relativ zum Projekt-Root)
storeFile=dvcard-keys/dvcard-release-key.jks
# Keystore Passwort
storePassword=IHR_KEYSTORE_PASSWORD
# Key Alias
keyAlias=dvcard-key  
# Key Passwort
keyPassword=IHR_KEY_PASSWORD
